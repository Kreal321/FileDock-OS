[project]
name = "filedock-contract-tests"
version = "0.1.0"
description = "Contract checks: subsystem manifest schema and gRPC proto compatibility"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
