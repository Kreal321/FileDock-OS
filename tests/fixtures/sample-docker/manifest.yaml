schemaVersion: 1
id: sample-docker
name: Sample Docker extension
version: 1.0.0
class: extension
capabilities: [cache.generic]
runtime:
  type: docker-service
  image: "IMAGE_DIGEST"
  command: [/sample]
health: {type: grpc, intervalSeconds: 5, startupGraceSeconds: 10}
permissions: []
data:
  - name: data
    mountPath: /data
    description: Sample persistent state
    suggestedImportance: Important
compatibility: {appliance: ">=0.1.0 <0.2.0", extensionProtocol: "1"}
