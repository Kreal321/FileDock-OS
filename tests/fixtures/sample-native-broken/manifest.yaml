schemaVersion: 1
id: sample-native
name: Sample broken native upgrade
version: 2.0.0
class: extension
capabilities: [cache.generic]
runtime:
  type: native-process
  executable: ./sample
  args: [--broken]
health: {type: grpc, intervalSeconds: 5, startupGraceSeconds: 5}
permissions: [core.events.read, core.alerts.write]
compatibility: {appliance: ">=0.1.0 <0.2.0", extensionProtocol: "1"}
