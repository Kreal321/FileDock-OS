# expect-error: cloud.credentials
schemaVersion: 1
id: no-credentials
name: Connector without cloud.credentials
version: 0.1.0
class: extension
capabilities:
  - cloud.remote
runtime:
  type: native-process
  executable: ./bin/connector
health:
  type: grpc
permissions:
  - network.outbound
cloud:
  - family: s3-compatible
    capabilities: [cloud.remote]
compatibility:
  appliance: ">=0.1.0"
